<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clara</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    background: #111;
    border-bottom: 1px solid #222;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header .status { font-size: 12px; color: #666; }
  #new-chat {
    background: none;
    border: 1px solid #333;
    color: #888;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #new-chat:hover { border-color: #555; color: #aaa; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #2563eb;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.clara {
    align-self: flex-start;
    background: #1a1a1a;
    color: #e0e0e0;
    border-bottom-left-radius: 4px;
  }
  .typing {
    align-self: flex-start;
    color: #555;
    font-size: 13px;
    font-style: italic;
  }
  #input-area {
    padding: 16px 20px;
    background: #111;
    border-top: 1px solid #222;
    display: flex;
    gap: 10px;
  }
  #input {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #e0e0e0;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    resize: none;
    max-height: 120px;
    font-family: inherit;
  }
  #input:focus { border-color: #2563eb; }
  #send {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
  }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }
  #send:hover:not(:disabled) { background: #1d4ed8; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Clara</h1>
    <span class="status" id="status">new conversation</span>
  </div>
  <button id="new-chat">new chat</button>
</header>

<div id="messages"></div>

<div id="input-area">
  <textarea id="input" rows="1" placeholder="say something..."></textarea>
  <button id="send">send</button>
</div>

<script>
const API_URL = 'http://localhost:5678/webhook/clara-chat';
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const newChatBtn = document.getElementById('new-chat');

let sessionId = null;
let sending = false;

// Auto-resize textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// Send on Enter (Shift+Enter for newline)
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

sendBtn.addEventListener('click', send);
newChatBtn.addEventListener('click', newChat);

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role === 'user' ? 'user' : 'clara'}`;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing';
  div.textContent = 'clara is typing...';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || sending) return;

  sending = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  addMsg('user', text);
  showTyping();

  try {
    const body = { message: text };
    if (sessionId) body.session_id = sessionId;

    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const data = await res.json();
    hideTyping();

    if (data.session_id && !sessionId) {
      sessionId = data.session_id;
      statusEl.textContent = sessionId.slice(0, 20) + '...';
    }

    addMsg('clara', data.reply);
  } catch (err) {
    hideTyping();
    addMsg('clara', 'connection error — is n8n running?');
  }

  sending = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

function newChat() {
  sessionId = null;
  messagesEl.innerHTML = '';
  statusEl.textContent = 'new conversation';
  addMsg('clara', 'hey');
  inputEl.focus();
}

// Start with a greeting
newChat();
</script>

</body>
</html>
